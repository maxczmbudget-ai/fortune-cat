<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fortune Cat</title>
  <meta name="description" content="Daily spending tracker with a lucky cat that gets richer as you save.">
  <meta name="theme-color" content="#faf5ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191513" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">招</span> Fortune Cat</div>
    <button class="icon-btn" data-action="refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <main id="view" aria-live="polite"></main>

  <button class="fab" data-action="open-add" aria-label="Add a payment">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>

  <nav class="tabs" aria-label="Sections">
    <button data-tab="home" class="active"><span aria-hidden="true">🐱</span>Home</button>
    <button data-tab="history"><span aria-hidden="true">🧾</span>History</button>
    <button data-tab="goals"><span aria-hidden="true">🎯</span>Goals</button>
    <button data-tab="settings"><span aria-hidden="true">⚙️</span>Settings</button>
  </nav>

  <dialog id="sheet" class="sheet"><div id="sheet-body"></div></dialog>
  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
